name: Apply Marathon Layout

on:
  push:
    branches:
      - fix/marathon-major-battle-skip-lock

permissions:
  contents: write

jobs:
  migrate-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply migration
        run: python scripts/apply_marathon_layout.py
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Verify sprites
        working-directory: frontend
        run: npm run verify:sprites
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Unit tests
        working-directory: frontend
        run: npm test -- --run
      - name: Production build
        working-directory: frontend
        run: npm run build
      - name: Backend tests
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pytest backend
      - name: Commit generated update
        run: |
          rm -f scripts/apply_marathon_layout.py .github/workflows/apply-marathon-layout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: redesign marathon battle and staged results UI"
          git push origin HEAD:fix/marathon-major-battle-skip-lock
