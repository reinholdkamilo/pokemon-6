name: Fix Adventure Type Narrowing

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/fix-adventure-type.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Fix battle event type narrowing
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("frontend/app/adventure/page.tsx")
          content = path.read_text(encoding="utf-8")
          old = 'onClick={() => onBattle(event.kind)}>BATTLE</button>;'
          new = 'onClick={() => onBattle(event.kind as "trainer" | "rival" | "gym")}>BATTLE</button>;'
          if old not in content:
              raise SystemExit("Expected Adventure battle callback was not found")
          path.write_text(content.replace(old, new, 1), encoding="utf-8")
          PY
          rm .github/workflows/fix-adventure-type.yml
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/app/adventure/page.tsx .github/workflows/fix-adventure-type.yml
          git commit -m "Fix Adventure battle event type narrowing"
          git push origin HEAD:dev
