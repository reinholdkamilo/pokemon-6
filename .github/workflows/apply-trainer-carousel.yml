name: Apply Trainer Carousel

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/apply-trainer-carousel.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - name: Generate trainer sprite data and update screens
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')
          assets = root / '.trainer-assets'

          def read_parts(*names):
              return ''.join((assets / name).read_text(encoding='utf-8').strip() for name in names)

          data = {
              'chaz': 'data:image/jpeg;base64,' + read_parts('chaz.1', 'chaz.2'),
              'laga': 'data:image/jpeg;base64,' + read_parts('laga'),
              'kevin': 'data:image/jpeg;base64,' + read_parts('kevin.1', 'kevin.2', 'kevin.3'),
              'gj': 'data:image/jpeg;base64,' + read_parts('gj.1', 'gj.2', 'gj.3'),
          }

          sprite_data = 'export const TRAINER_SPRITE_DATA = ' + json.dumps(data, separators=(',', ':')) + ' as const;\n'
          (root / 'frontend/lib/trainerSpriteData.ts').write_text(sprite_data, encoding='utf-8')

          image_paths = root / 'frontend/lib/imagePaths.ts'
          content = image_paths.read_text(encoding='utf-8')
          if 'trainerSpriteData' not in content:
              content = 'import { TRAINER_SPRITE_DATA } from "@/lib/trainerSpriteData";\n\n' + content
          content = content.replace('chaz: "/images/trainers/player/chaz.png",', 'chaz: TRAINER_SPRITE_DATA.chaz,')
          content = content.replace('laga: "/images/trainers/player/laga.png",', 'laga: TRAINER_SPRITE_DATA.laga,')
          content = content.replace('kevin: "/images/trainers/player/kevin.png",', 'kevin: TRAINER_SPRITE_DATA.kevin,')
          content = content.replace('gj: "/images/trainers/player/gj.png",', 'gj: TRAINER_SPRITE_DATA.gj,')
          image_paths.write_text(content, encoding='utf-8')

          trainer_screen = '''"use client";

import { useState } from "react";
import { GameTopBar } from "@/components/GameTopBar";
import { LocalSprite } from "@/components/LocalSprite";
import { getPlayerTrainerSprite } from "@/lib/imagePaths";
import type { TrainerProfile } from "@/types/pokemon";

type TrainerCardScreenProps = {
  onMainMenu?: () => void;
  onTrainerSaved: (trainerProfile: TrainerProfile) => void;
};

type CharacterOption = Pick<TrainerProfile, "sprite"> & {
  label: string;
  fallback: string;
};

const CHARACTERS: CharacterOption[] = [
  { sprite: "chaz", label: "Chaz", fallback: "C" },
  { sprite: "laga", label: "Laga", fallback: "L" },
  { sprite: "kevin", label: "Kevin", fallback: "K" },
  { sprite: "gj", label: "GJ", fallback: "GJ" },
];

export function TrainerCardScreen({ onMainMenu, onTrainerSaved }: TrainerCardScreenProps) {
  const [characterIndex, setCharacterIndex] = useState(0);
  const selectedCharacter = CHARACTERS[characterIndex];

  function showPreviousCharacter() {
    setCharacterIndex((current) => current === 0 ? CHARACTERS.length - 1 : current - 1);
  }

  function showNextCharacter() {
    setCharacterIndex((current) => (current + 1) % CHARACTERS.length);
  }

  function choosePokemon() {
    onTrainerSaved({
      name: selectedCharacter.label,
      dob: "",
      email: "",
      hometown: "Pallet Town",
      sprite: selectedCharacter.sprite,
      created_at: new Date().toISOString(),
    });
  }

  return (
    <main className="game-shell">
      <section className="trainer-card-screen" aria-label="Choose your Adventure character">
        {onMainMenu ? <GameTopBar modeLabel="Adventure Mode" onMainMenu={onMainMenu} /> : null}
        <article className="trainer-profile-card">
          <div className="trainer-card-header">
            <div>
              <p className="eyebrow">Player Details</p>
              <h1>Choose Your Character</h1>
            </div>
            <span className="trainer-card-id">BADGES 0</span>
          </div>

          <div className="trainer-sprite-picker" role="radiogroup" aria-label="Adventure character">
            <button className="sprite-nav-button" type="button" aria-label="Previous character" onClick={showPreviousCharacter}>{"<"}</button>
            <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "12px", minWidth: "240px" }}>
              <LocalSprite
                alt={selectedCharacter.label}
                className="player-trainer-sprite"
                fallback={selectedCharacter.fallback}
                src={getPlayerTrainerSprite(selectedCharacter.sprite)}
              />
              <strong style={{ fontSize: "1.4rem" }}>{selectedCharacter.label}</strong>
              <span>{characterIndex + 1} / {CHARACTERS.length}</span>
            </div>
            <button className="sprite-nav-button" type="button" aria-label="Next character" onClick={showNextCharacter}>{">"}</button>
          </div>

          <div className="trainer-card-actions">
            <button className="primary-action" type="button" onClick={choosePokemon}>CHOOSE YOUR POKEMON</button>
          </div>
        </article>
      </section>
    </main>
  );
}
'''
          (root / 'frontend/components/TrainerCardScreen.tsx').write_text(trainer_screen, encoding='utf-8')

          results = root / 'frontend/components/EndResultsScreen.tsx'
          content = results.read_text(encoding='utf-8')
          content = content.replace('import { BADGE_IMAGE_PATHS } from "@/lib/imagePaths";', 'import { BADGE_IMAGE_PATHS, getPlayerTrainerSprite } from "@/lib/imagePaths";')
          content = content.replace('            rank={resultRank}\n          />', '            rank={resultRank}\n            trainerProfile={trainerProfile}\n          />')
          content = content.replace('  rank: string;\n};', '  rank: string;\n  trainerProfile: TrainerProfile;\n};')
          content = content.replace('  rank,\n}: ResultsTrainerCardProps)', '  rank,\n  trainerProfile,\n}: ResultsTrainerCardProps)')
          content = content.replace('<span className="results-trainer-card__logo">POKEMON 6</span>\n </div>', '<span className="results-trainer-card__logo">POKEMON 6</span>\n          <div style={{ display: "flex", alignItems: "center", gap: "14px", marginTop: "14px" }}>\n            <img alt={trainerProfile.name} src={getPlayerTrainerSprite(trainerProfile.sprite)} style={{ width: "110px", height: "150px", objectFit: "contain", imageRendering: "pixelated" }} />\n            <strong style={{ fontSize: "1.4rem" }}>{trainerProfile.name}</strong>\n          </div>\n </div>')
          results.write_text(content, encoding='utf-8')
          PY

      - name: Verify production build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Commit completed trainer update
        run: |
          rm .github/workflows/apply-trainer-carousel.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/lib/trainerSpriteData.ts frontend/lib/imagePaths.ts frontend/components/TrainerCardScreen.tsx frontend/components/EndResultsScreen.tsx .github/workflows/apply-trainer-carousel.yml
          git commit -m "Add trainer sprite carousel and results card character"
          git push origin HEAD:dev
