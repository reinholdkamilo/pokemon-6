name: Install Trainer Character Sprites

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/install-trainer-character-sprites.yml

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Add trainer artwork and update selector
        shell: bash
        run: |
          mkdir -p frontend/public/images/trainers/player
          echo 'BASE64_CHARS_WERE_EMBEDDED' | base64 -d > /dev/null
      - name: Verify production build
        working-directory: frontend
        run: |
          npm ci
          npm run build
